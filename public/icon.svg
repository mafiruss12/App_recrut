<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="k2l-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#k2l-grad)"/>
  
  <!-- Subtle circular grid pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Main K2L Emblem / Symbol -->
  <g transform="translate(136, 120)">
    <!-- Shield / Card base -->
    <path d="M120 0 L220 50 L220 160 C220 220 120 260 120 260 C120 260 20 220 20 160 L20 50 Z" 
          fill="rgba(255,255,255,0.12)" stroke="url(#accent-grad)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- User checkmark / recruitment badge inside shield -->
    <circle cx="120" cy="100" r="34" fill="#38bdf8" />
    <path d="M70 175 C70 145 92 135 120 135 C148 135 170 145 170 175" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- Checkmark badge -->
    <circle cx="155" cy="145" r="18" fill="#22c55e" stroke="#0f172a" stroke-width="4"/>
    <path d="M148 145 L153 150 L163 140" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography K2L -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">K2L RECRUT</text>
</svg>
